name: Build
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:

jobs:
  build-python:
    uses: goes-funky/workflows/.github/workflows/build-python.yaml@ignore-ssh-agent-if-missing-env
    with:
      python-version: "3.9"
      skip-mypy: true
      skip-tests: false
      skip-isort: true
      skip-format: true
      skip-lint: true
      is-repo-public: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
